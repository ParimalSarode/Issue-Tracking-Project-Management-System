[project]
name = "issue-tracker"
version = "0.1.0"
description = "A FastAPI-based Agile Issue Tracking System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "sqlalchemy==2.0.30",
    "pydantic==2.7.2",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "pyjwt==2.8.0",
    "jinja2==3.1.4",
    "python-multipart==0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "httpx==0.27.0"
]