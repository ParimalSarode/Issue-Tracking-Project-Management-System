<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Tracking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">IssueTracker</span>
            <button id="logoutBtn" class="btn btn-outline-light btn-sm hidden" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <!-- Auth Section -->
        <div id="authSection" class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title text-center mb-4" id="authTitle">Login</h4>
                        <form id="authForm" onsubmit="handleAuth(event)">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" id="username" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" id="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="authSubmitBtn">Login</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="#" onclick="toggleAuthMode()" id="authToggleText">Need an account? Register</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="hidden">
            <div class="row mb-4">
                <div class="col">
                    <h3>Projects</h3>
                    <div class="card shadow-sm mb-3">
                        <div class="card-body">
                            <form id="projectForm" onsubmit="createProject(event)" class="d-flex gap-2">
                                <input type="text" id="projName" class="form-control" placeholder="Project Name" required>
                                <input type="text" id="projDesc" class="form-control" placeholder="Description">
                                <button type="submit" class="btn btn-success">Create</button>
                            </form>
                        </div>
                    </div>
                    <ul id="projectList" class="list-group"></ul>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <h3>Issues</h3>
                    <div class="card shadow-sm mb-3">
                        <div class="card-body">
                            <form id="issueForm" onsubmit="createIssue(event)" class="d-flex gap-2">
                                <select id="issueProject" class="form-select" required>
                                    <option value="">Select Project...</option>
                                </select>
                                <input type="text" id="issueTitle" class="form-control" placeholder="Issue Title" required>
                                <button type="submit" class="btn btn-danger">Report Bug</button>
                            </form>
                        </div>
                    </div>
                    <div id="issueList" class="row g-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
